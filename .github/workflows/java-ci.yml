name: Java CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile sources and tests
        run: mvn --batch-mode --no-transfer-progress test-compile
      - name: Test Marco life simulation
        run: java -ea -cp target/classes:target/test-classes com.holovin.npclife.SimulationSmokeTest
      - name: Test town simulation and eyewitness isolation
        run: java -ea -cp target/classes:target/test-classes com.holovin.npclife.TownSmokeTest
      - name: Test NPC social interactions
        run: java -ea -cp target/classes:target/test-classes com.holovin.npclife.SocialSmokeTest
      - name: Test Elena weekend shopping and long-term survival
        run: java -ea -cp target/classes:target/test-classes com.holovin.npclife.ElenaSurvivalSmokeTest
      - name: Test generated population over 30 days
        run: java -ea -cp target/classes:target/test-classes com.holovin.npclife.PopulationSmokeTest
      - name: Test social persistence and v1.1 SQLite migration
        run: >-
          mvn --batch-mode --no-transfer-progress -Dexec.executable=java -Dexec.classpathScope=test
          '-Dexec.args=-ea -cp %classpath com.holovin.npclife.SocialDatabaseSmokeTest' exec:exec
      - name: Test generated resident persistence and SQLite migrations
        run: >-
          mvn --batch-mode --no-transfer-progress -Dexec.executable=java -Dexec.classpathScope=test
          '-Dexec.args=-ea -cp %classpath com.holovin.npclife.PopulationDatabaseSmokeTest' exec:exec
      - name: Test private home witness isolation
        run: java -ea -cp target/classes:target/test-classes com.holovin.npclife.PrivateLivesSmokeTest
      - name: Test private scene persistence and v1.3 SQLite migration
        run: >-
          mvn --batch-mode --no-transfer-progress -Dexec.executable=java -Dexec.classpathScope=test
          '-Dexec.args=-ea -cp %classpath com.holovin.npclife.PrivateLivesDatabaseSmokeTest' exec:exec
      - name: Test autonomous relationships across the generated population
        run: java -ea -cp target/classes:target/test-classes com.holovin.npclife.SocialNetworkSmokeTest
      - name: Test arbitrary-pair relationship SQLite persistence
        run: >-
          mvn --batch-mode --no-transfer-progress -Dexec.executable=java -Dexec.classpathScope=test
          '-Dexec.args=-ea -cp %classpath com.holovin.npclife.SocialNetworkDatabaseSmokeTest' exec:exec
      - name: Test attributed direct and secondhand knowledge
        run: java -ea -cp target/classes:target/test-classes com.holovin.npclife.KnowledgeSmokeTest
      - name: Test knowledge propagation through actual town conversations
        run: java -ea -cp target/classes:target/test-classes com.holovin.npclife.KnowledgeIntegrationSmokeTest
      - name: Test SQLite attributed belief and information exchange persistence
        run: >-
          mvn --batch-mode --no-transfer-progress -Dexec.executable=java -Dexec.classpathScope=test
          '-Dexec.args=-ea -cp %classpath com.holovin.npclife.KnowledgeDatabaseSmokeTest' exec:exec
      - name: Test secrets and dishonest claims without changing world truth
        run: java -ea -cp target/classes:target/test-classes com.holovin.npclife.DeceptionSmokeTest
      - name: Test SQLite secret and deceptive claim persistence
        run: >-
          mvn --batch-mode --no-transfer-progress -Dexec.executable=java -Dexec.classpathScope=test
          '-Dexec.args=-ea -cp %classpath com.holovin.npclife.DeceptionDatabaseSmokeTest' exec:exec
      - name: Test deception in a full two-week simulated town
        run: java -ea -cp target/classes:target/test-classes com.holovin.npclife.DeceptionIntegrationSmokeTest
      - name: Test first playable investigation mechanics
        run: java -ea -cp target/classes:target/test-classes com.holovin.npclife.InvestigationSmokeTest
      - name: Test autonomous case emergence in a living town
        run: java -ea -cp target/classes:target/test-classes com.holovin.npclife.InvestigationIntegrationSmokeTest
      - name: Test investigation SQLite migration and persistence
        run: >-
          mvn --batch-mode --no-transfer-progress -Dexec.executable=java -Dexec.classpathScope=test
          '-Dexec.args=-ea -cp %classpath com.holovin.npclife.InvestigationDatabaseSmokeTest' exec:exec
      - name: Test ambiguous scene evidence and independently corroborated alibis
        run: java -ea -cp target/classes:target/test-classes com.holovin.npclife.AlibiSmokeTest
      - name: Test alibi SQLite persistence and migration from v1.8 cases
        run: >-
          mvn --batch-mode --no-transfer-progress -Dexec.executable=java -Dexec.classpathScope=test
          '-Dexec.args=-ea -cp %classpath com.holovin.npclife.AlibiDatabaseSmokeTest' exec:exec
      - name: Test motivation, background leads and legacy privacy
        run: java -ea -cp target/classes:target/test-classes com.holovin.npclife.MotiveSmokeTest
      - name: Test motive-driven incident opportunities over 21 days
        run: java -ea -cp target/classes:target/test-classes com.holovin.npclife.MotiveIntegrationSmokeTest
      - name: Test historical motive persistence and additive SQLite migration
        run: >-
          mvn --batch-mode --no-transfer-progress -Dexec.executable=java -Dexec.classpathScope=test
          '-Dexec.args=-ea -cp %classpath com.holovin.npclife.MotiveDatabaseSmokeTest' exec:exec
      - name: Test conserved peer transfers, late payments and bill arrears
        run: java -ea -cp target/classes:target/test-classes com.holovin.npclife.EconomySmokeTest
      - name: Test autonomous household economy and lending over 14 days
        run: java -ea -cp target/classes:target/test-classes com.holovin.npclife.EconomyIntegrationSmokeTest
      - name: Test SQLite financial ledger and contract persistence
        run: >-
          mvn --batch-mode --no-transfer-progress -Dexec.executable=java -Dexec.classpathScope=test
          '-Dexec.args=-ea -cp %classpath com.holovin.npclife.EconomyDatabaseSmokeTest' exec:exec
      - name: Test job loss, re-employment and temporary illness expenses
        run: java -ea -cp target/classes:target/test-classes com.holovin.npclife.EmploymentSmokeTest
      - name: Test autonomous resident life changes over 35 days
        run: java -ea -cp target/classes:target/test-classes com.holovin.npclife.EmploymentIntegrationSmokeTest
      - name: Test career events and medical arrears SQLite migration
        run: >-
          mvn --batch-mode --no-transfer-progress -Dexec.executable=java -Dexec.classpathScope=test
          '-Dexec.args=-ea -cp %classpath com.holovin.npclife.EmploymentDatabaseSmokeTest' exec:exec
      - name: Test physically identified items, legal title and theft custody
        run: java -ea -cp target/classes:target/test-classes com.holovin.npclife.PropertySmokeTest
      - name: Test real item transfers in autonomous 21-day investigations
        run: java -ea -cp target/classes:target/test-classes com.holovin.npclife.PropertyIntegrationSmokeTest
      - name: Test SQLite physical items, property audit and case linkage
        run: >-
          mvn --batch-mode --no-transfer-progress -Dexec.executable=java -Dexec.classpathScope=test
          '-Dexec.args=-ea -cp %classpath com.holovin.npclife.PropertyDatabaseSmokeTest' exec:exec
      - name: Test evidence-gated item seizure and return
        run: java -ea -cp target/classes:target/test-classes com.holovin.npclife.RecoverySmokeTest
      - name: Test repeat victim protection in a 28-day town
        run: java -ea -cp target/classes:target/test-classes com.holovin.npclife.RecoveryIntegrationSmokeTest
      - name: Test SQLite search, seizure and return persistence
        run: >-
          mvn --batch-mode --no-transfer-progress -Dexec.executable=java -Dexec.classpathScope=test
          '-Dexec.args=-ea -cp %classpath com.holovin.npclife.RecoveryDatabaseSmokeTest' exec:exec
