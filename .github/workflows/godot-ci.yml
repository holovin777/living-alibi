name: Godot Park Scene

on:
  push:
    branches: [main]
    paths:
      - 'godot/**'
      - 'tools/**'
      - 'play.sh'
      - '.github/workflows/godot-ci.yml'
  pull_request:
    paths:
      - 'godot/**'
      - 'tools/**'
      - 'play.sh'
      - '.github/workflows/godot-ci.yml'

concurrency:
  group: godot-ci-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  import-and-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Godot project
        uses: actions/checkout@v4
      - name: Check graphics launcher selection
        run: |
          for script in play.sh tools/launch-geographic.sh tools/game_gpu.sh tools/game_dialogue.sh tools/tests/test_game_dialogue.sh; do bash -n "$script"; done
          bash play.sh --help | grep -q -- "--wide"
          bash tools/tests/test_game_gpu.sh
          bash tools/tests/test_game_dialogue.sh
      - name: Install official Godot 4.6.1 stable editor
        run: |
          set -euo pipefail
          mkdir -p target/godot-bin
          curl --fail --location --retry 3 --silent --show-error \
            -o target/godot-bin/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip
          unzip -q target/godot-bin/godot.zip -d target/godot-bin
          chmod +x target/godot-bin/Godot_v4.6.1-stable_linux.x86_64
      - name: Import Godot project and check GDScript parse errors
        run: |
          set -euo pipefail
          target/godot-bin/Godot_v4.6.1-stable_linux.x86_64 \
            --headless --path godot --editor --quit 2>&1 | tee target/godot-bin/import.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed loading resource|ERROR:.*script' \
            target/godot-bin/import.log; then
            exit 1
          fi
      - name: Launch park scene headlessly without Spring
        run: |
          set -euo pipefail
          target/godot-bin/Godot_v4.6.1-stable_linux.x86_64 \
            --headless --path godot --quit-after 5 2>&1 | tee target/godot-bin/game.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed loading resource|ERROR:.*script' \
            target/godot-bin/game.log; then
            exit 1
          fi
      - name: Check offline OSM importer and geographic scene
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/tests
          python3 tools/import_vigevano.py --input tools/tests/vigevano_fixture.osm --output data/vigevano-test.json
          target/godot-bin/Godot_v4.6.1-stable_linux.x86_64 \
            --headless --path godot res://scenes/vigevano.tscn --quit-after 8 -- "--city-map=$PWD/data/vigevano-test.json" \
            2>&1 | tee target/godot-bin/geography.log
          grep -q 'VigevanoPreview: loaded' target/godot-bin/geography.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed loading resource|ERROR:.*script' target/godot-bin/geography.log; then exit 1; fi

      - name: Test geographic walking and directed motor graph
        run: |
          set -euo pipefail
          target/godot-bin/Godot_v4.6.1-stable_linux.x86_64 --headless --path godot --script res://tests/GeoRoadGraphSmoke.gd 2>&1 | tee target/godot-bin/geograph.log
          grep -q 'GeoRoadGraphSmoke: ALL CHECKS PASSED' target/godot-bin/geograph.log

      - name: Test bounded geographic traffic
        run: |
          set -euo pipefail
          target/godot-bin/Godot_v4.6.1-stable_linux.x86_64 --headless --path godot --script res://tests/GeoTrafficSmoke.gd 2>&1 | tee target/godot-bin/geotraffic.log
          grep -q 'GeoTrafficSmoke: ALL CHECKS PASSED' target/godot-bin/geotraffic.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed loading resource|ERROR:.*script' target/godot-bin/geotraffic.log; then exit 1; fi

      - name: Test geographic Java population and persistence
        run: |
          set -euo pipefail
          python3 tools/export_geo_population.py data/vigevano-test.json data/vigevano-test.tsv
          mkdir -p target/geo-world
          javac -d target/geo-world tools/geoworld/GeoWorld.java tools/geoworld/GeoWorldSmoke.java
          java -cp target/geo-world GeoWorldSmoke

      - name: Test modular geographic interiors
        run: |
          set -euo pipefail
          target/godot-bin/Godot_v4.6.1-stable_linux.x86_64 --headless --path godot --script res://tests/GeoInteriorSmoke.gd 2>&1 | tee target/godot-bin/geo-interior.log
          grep -q 'GeoInteriorSmoke: ALL CHECKS PASSED' target/godot-bin/geo-interior.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed loading resource|ERROR:.*script' target/godot-bin/geo-interior.log; then exit 1; fi

      - name: Test batched geographic facade and street geometry
        run: |
          set -euo pipefail
          target/godot-bin/Godot_v4.6.1-stable_linux.x86_64 --headless --path godot --script res://tests/GeoArchitectureSmoke.gd 2>&1 | tee target/godot-bin/geo-architecture.log
          grep -q 'GeoArchitectureSmoke: ALL CHECKS PASSED' target/godot-bin/geo-architecture.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed loading resource|ERROR:.*script' target/godot-bin/geo-architecture.log; then exit 1; fi

      - name: Verify geographic precipitation
        run: |
          set -euo pipefail
          target/godot-bin/Godot_v4.6.1-stable_linux.x86_64 --headless --path godot --script res://tests/GeoWeatherSmoke.gd 2>&1 | tee target/godot-bin/geo-weather.log
          grep -q 'GeoWeatherSmoke: ALL CHECKS PASSED' target/godot-bin/geo-weather.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed loading resource|ERROR:.*script' target/godot-bin/geo-weather.log; then exit 1; fi

      - name: Verify geographic smartphone apps
        run: |
          set -euo pipefail
          target/godot-bin/Godot_v4.6.1-stable_linux.x86_64 --headless --path godot --script res://tests/GeoPhoneSmoke.gd 2>&1 | tee target/godot-bin/geo-phone.log
          grep -q 'GeoPhoneSmoke: ALL CHECKS PASSED' target/godot-bin/geo-phone.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed loading resource|ERROR:.*script' target/godot-bin/geo-phone.log; then exit 1; fi

      - name: Verify geographic work editor
        run: |
          set -euo pipefail
          target/godot-bin/Godot_v4.6.1-stable_linux.x86_64 --headless --path godot --script res://tests/GeoWorkSmoke.gd 2>&1 | tee target/godot-bin/geo-work.log
          grep -q 'GeoWorkSmoke: ALL CHECKS PASSED' target/godot-bin/geo-work.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed loading resource|ERROR:.*script' target/godot-bin/geo-work.log; then exit 1; fi

      - name: Verify geographic property scenery
        run: |
          set -euo pipefail
          target/godot-bin/Godot_v4.6.1-stable_linux.x86_64 --headless --path godot --script res://tests/GeoPropertyScenerySmoke.gd 2>&1 | tee target/godot-bin/geo-property-scenery.log
          grep -q 'GeoPropertyScenerySmoke: ALL CHECKS PASSED' target/godot-bin/geo-property-scenery.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed loading resource|ERROR:.*script' target/godot-bin/geo-property-scenery.log; then exit 1; fi

      - name: Verify park, market, school and workshop scene transitions
        run: |
          set -euo pipefail
          target/godot-bin/Godot_v4.6.1-stable_linux.x86_64 \
            --headless --path godot --script res://tests/SceneNavigationSmoke.gd \
            2>&1 | tee target/godot-bin/navigation.log
          grep -q 'SceneNavigationSmoke: ALL CHECKS PASSED' \
            target/godot-bin/navigation.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed loading resource|ERROR:.*script' \
            target/godot-bin/navigation.log; then
            exit 1
          fi
